name: Release

# Builds Empyrion Admin Manager for Windows and publishes the zip as a GitHub release.
# Runs on every push to main: when the version in Directory.Build.props has no release yet,
# the release vX.Y.Z is created automatically (with its tag). Can also be started by hand.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $tag = "v$version"
          gh release view $tag 2>$null | Out-Null
          $exists = if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exists=$exists" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version, release exists: $exists"
          exit 0
      - uses: actions/setup-dotnet@v4
        if: steps.v.outputs.exists == 'false'
        with:
          dotnet-version: '8.0.x'
      - name: Tests
        if: steps.v.outputs.exists == 'false'
        run: dotnet test tests/Eam.Tests -c Release
      - name: Build the release zip
        if: steps.v.outputs.exists == 'false'
        shell: pwsh
        run: ./tools/publish.ps1
      - name: Publish the release
        if: steps.v.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.v.outputs.tag }}"
          $zip = Get-ChildItem dist\EmpyrionAdminManager-*.zip | Select-Object -First 1
          $notes = @"
          Download $($zip.Name), unzip it anywhere and run EmpyrionAdminManager.exe (Windows 10/11 or Windows Server 2019+, 64-bit). Try it on a test server first. Tutorial in the README, changes in CHANGELOG.md.

          Telechargez $($zip.Name), decompressez-le et lancez EmpyrionAdminManager.exe. Essayez-le d'abord sur un serveur de test. Tutoriel dans le README, nouveautes dans CHANGELOG.md.
          "@
          gh release create $tag $zip.FullName --target $env:GITHUB_SHA --title "Empyrion Admin Manager ${{ steps.v.outputs.version }}" --notes $notes
